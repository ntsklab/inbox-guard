name: Base image update

# When the golang:1.26-alpine base image digest drifts (Go patch updates,
# alpine rebuilds), bump the patch digit of VERSION and record the new
# digest. The commit touches VERSION, which triggers publish.yml and ships
# the freshly rebuilt image. If the digest is unchanged, nothing is built.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

concurrency:
  group: base-update

jobs:
  check-and-bump:
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve digest of golang:1.26-alpine
        id: digest
        run: |
          token=$(curl -fsS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/golang:pull" | jq -r .token)
          digest=$(curl -fsSI \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.index.v1+json" \
            "https://registry-1.docker.io/v2/library/golang/manifests/1.26-alpine" \
            | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')
          if [ -z "$digest" ]; then
            echo "failed to resolve golang:1.26-alpine digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Compare with recorded digest
        id: changed
        run: |
          stored=$(tr -d '[:space:]' < .golang-base-digest 2>/dev/null)
          if [ -z "$stored" ]; then
            echo "error: .golang-base-digest missing"
            exit 1
          fi
          if [ "$stored" = "${{ steps.digest.outputs.digest }}" ]; then
            echo "base image unchanged ($stored); nothing to build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "base image changed: $stored -> ${{ steps.digest.outputs.digest }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version and record digest
        if: steps.changed.outputs.changed == 'true'
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION is not X.Y.Z ($v); refusing to auto-bump"
            exit 1
          fi
          major=${v%%.*}
          rest=${v#*.}
          minor=${rest%%.*}
          patch=${rest#*.}
          new="${major}.${minor}.$((patch + 1))"
          printf '%s\n' "$new" > VERSION
          echo "${{ steps.digest.outputs.digest }}" > .golang-base-digest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION .golang-base-digest
          git commit -m "base: bump to golang:1.26-alpine ${{ steps.digest.outputs.digest }} (v${new})"
          git push origin HEAD:main

  # A GITHUB_TOKEN push does not create workflow events, so publish is
  # invoked directly instead of waiting for the VERSION push to trigger it.
  publish:
    needs: check-and-bump
    if: needs.check-and-bump.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
