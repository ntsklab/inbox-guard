name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          # The runner image caches an older 1.26.x patch; re-check the
          # release manifest so govulncheck runs against the newest patch.
          check-latest: true

      - run: go vet ./...

      - name: Security lint (gosec)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # Run gosec only; static analyzers (vet, tests) live elsewhere.
          args: --enable-only gosec --timeout 5m

      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
