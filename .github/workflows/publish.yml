name: Publish to ghcr.io

on:
  workflow_dispatch:
  # Reusable entry point for base-update.yml (a GITHUB_TOKEN push cannot
  # trigger this workflow directly, so base-update calls it as a job).
  workflow_call:
    inputs:
      bump:
        description: "True when the caller just bumped VERSION"
        type: boolean
        default: false
      ref:
        description: "Commit sha to check out (callers passing bump need to pass the bumped sha)"
        type: string
        default: ""
  # Rebuilds are driven by VERSION changes only (see base-update.yml, which
  # bumps VERSION when the golang base image digest drifts). This avoids
  # pointless weekly rebuilds when neither code nor base image changed.
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - '.github/workflows/publish.yml'
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_call from base-update must check out the freshly pushed
          # bump commit, not the caller's stale github.sha.
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Detect version bump
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ] \
            || [ "${{ inputs.bump }}" = "true" ] \
            || git diff --name-only HEAD^ HEAD -- VERSION | grep -q .; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "bump=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.bump.outputs.bump == 'true' }}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
