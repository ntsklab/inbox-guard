name: Publish to ghcr.io

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - '.github/workflows/publish.yml'
    tags: ["v*"]
  schedule:
    # Weekly rebuild to pick up Go base-image patch updates for the `latest` tag
    - cron: '0 3 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Detect version bump
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ] || git diff --name-only HEAD^ HEAD -- VERSION | grep -q .; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "bump=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.bump.outputs.bump == 'true' }}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
